name: Daily Price Check

on:
  schedule:
    - cron: '0 8 * * *' # Katru dienu plkst. 08:00 no rīta (UTC laikā)
  workflow_dispatch: # Ļauj palaist arī manuāli

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python bot.py
